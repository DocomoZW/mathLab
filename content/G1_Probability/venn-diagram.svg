<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="Arial, sans-serif" font-size="14">
  <rect width="500" height="400" fill="#fff"/>
  
  <title>Venn Diagram</title>
  
  <!-- Universal set rectangle -->
  <rect x="40" y="40" width="420" height="300" rx="8" fill="#f8fafc" stroke="#333" stroke-width="2"/>
  <text x="445" y="55" font-style="italic" font-weight="bold" font-size="14">ξ</text>
  
  <!-- Circle A (left) -->
  <circle cx="200" cy="190" r="110" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="2.5"/>
  <text x="200" y="100" text-anchor="middle" font-weight="bold" font-size="18" fill="#2563eb">Football</text>
  
  <!-- Circle B (right) -->
  <circle cx="300" cy="190" r="110" fill="#dc2626" opacity="0.12" stroke="#dc2626" stroke-width="2.5"/>
  <text x="300" y="100" text-anchor="middle" font-weight="bold" font-size="18" fill="#dc2626">Tennis</text>
  
  <!-- A only -->
  <text x="170" y="190" text-anchor="middle" font-weight="bold" font-size="20" fill="#2563eb">8</text>
  <text x="170" y="210" text-anchor="middle" font-size="11" fill="#2563eb">(only football)</text>
  
  <!-- A ∩ B -->
  <text x="250" y="190" text-anchor="middle" font-weight="bold" font-size="20" fill="#8b5cf6">4</text>
  <text x="250" y="210" text-anchor="middle" font-size="11" fill="#8b5cf6">(both)</text>
  
  <!-- B only -->
  <text x="330" y="190" text-anchor="middle" font-weight="bold" font-size="20" fill="#dc2626">4</text>
  <text x="330" y="210" text-anchor="middle" font-size="11" fill="#dc2626">(only tennis)</text>
  
  <!-- Neither (outside both circles) -->
  <text x="70" y="310" font-weight="bold" font-size="16" fill="#64748b">4</text>
  <text x="40" y="325" font-size="11" fill="#64748b">(neither)</text>
  
  <!-- Labels -->
  <text x="250" y="40" text-anchor="middle" font-weight="bold" font-size="16">Venn Diagram — 20 Students</text>
  
  <!-- Total count -->
  <text x="250" y="375" text-anchor="middle" font-size="13" fill="#64748b">Total: 8 + 4 + 4 + 4 = 20 students</text>
  
  <!-- Formula -->
  <rect x="30" y="340" width="440" height="25" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="357" font-weight="bold">P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</text>
  <text x="280" y="357" font-size="12">P(neither) = 1 − P(A ∪ B)</text>
</svg>
