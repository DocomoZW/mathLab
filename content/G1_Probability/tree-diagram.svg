<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="Arial, sans-serif" font-size="14">
  <rect width="500" height="400" fill="#fff"/>
  
  <title>Probability Tree Diagram</title>
  
  <!-- Root node -->
  <circle cx="80" cy="200" r="5" fill="#111"/>
  
  <!-- First stage branches -->
  <!-- Branch 1: Red -->
  <line x1="85" y1="200" x2="220" y2="120" stroke="#dc2626" stroke-width="2.5"/>
  <text x="140" y="138" font-size="14" fill="#dc2626" font-weight="bold">Red</text>
  <text x="140" y="155" font-size="12">½</text>
  
  <!-- Branch 2: Blue -->
  <line x1="85" y1="200" x2="220" y2="280" stroke="#2563eb" stroke-width="2.5"/>
  <text x="140" y="268" font-size="14" fill="#2563eb" font-weight="bold">Blue</text>
  <text x="140" y="285" font-size="12">½</text>
  
  <!-- First-stage nodes -->
  <circle cx="220" cy="120" r="4" fill="#dc2626"/>
  <circle cx="220" cy="280" r="4" fill="#2563eb"/>
  
  <!-- Second stage branches from Red -->
  <!-- Red → Red -->
  <line x1="224" y1="120" x2="360" y2="60" stroke="#dc2626" stroke-width="2"/>
  <text x="280" y="75" fill="#dc2626">Red</text>
  <text x="280" y="90">¼</text>
  
  <!-- Red → Blue -->
  <line x1="224" y1="120" x2="360" y2="130" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="115" fill="#2563eb">Blue</text>
  <text x="280" y="130">¼</text>
  
  <!-- Red → Green -->
  <line x1="224" y1="120" x2="360" y2="200" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="178" fill="#16a34a">Green</text>
  <text x="280" y="193">½</text>
  
  <!-- Second stage branches from Blue -->
  <!-- Blue → Red -->
  <line x1="224" y1="280" x2="360" y2="200" stroke="#dc2626" stroke-width="2"/>
  <text x="280" y="220" fill="#dc2626">Red</text>
  <text x="280" y="235">⅓</text>
  
  <!-- Blue → Blue -->
  <line x1="224" y1="280" x2="360" y2="280" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="270" fill="#2563eb">Blue</text>
  <text x="280" y="285">⅓</text>
  
  <!-- Blue → Green -->
  <line x1="224" y1="280" x2="360" y2="350" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="335" fill="#16a34a">Green</text>
  <text x="280" y="350">⅓</text>
  
  <!-- Second-stage nodes -->
  <circle cx="360" cy="60" r="3" fill="#dc2626"/>
  <circle cx="360" cy="130" r="3" fill="#2563eb"/>
  <circle cx="360" cy="200" r="3" fill="#16a34a"/>
  <circle cx="360" cy="280" r="3" fill="#2563eb"/>
  <circle cx="360" cy="350" r="3" fill="#16a34a"/>
  
  <!-- Outcome probabilities -->
  <text x="375" y="64" font-size="11" fill="#64748b">⅛</text>
  <text x="375" y="134" font-size="11" fill="#64748b">⅛</text>
  <text x="375" y="204" font-size="11" fill="#64748b">¼</text>
  <text x="375" y="284" font-size="11" fill="#64748b">⅙</text>
  <text x="375" y="354" font-size="11" fill="#64748b">⅙</text>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-weight="bold" font-size="16">Probability Tree Diagram</text>
  
  <!-- Legend -->
  <rect x="30" y="370" width="440" height="25" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="387">Multiply along branches. Sum of outcome probabilities = 1.</text>
</svg>
