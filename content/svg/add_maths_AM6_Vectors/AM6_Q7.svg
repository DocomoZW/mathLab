<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340"
     font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
    <filter id="sketch">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="460" height="340" fill="#f4e8c1"/>
  <rect width="460" height="340" fill="url(#paper-texture)" opacity="0.08"/>
  <!-- deckle edge -->
  <rect x="6" y="6" width="448" height="328" fill="none" stroke="#6b5a4a" stroke-width="0.8" opacity="0.4"/>
  <line x1="40" y1="0" x2="40" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="80" y1="0" x2="80" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="120" y1="0" x2="120" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="160" y1="0" x2="160" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="200" y1="0" x2="200" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="240" y1="0" x2="240" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="280" y1="0" x2="280" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="320" y1="0" x2="320" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="360" y1="0" x2="360" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="440" y1="0" x2="440" y2="340" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="40" x2="460" y2="40" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="80" x2="460" y2="80" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="120" x2="460" y2="120" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="160" x2="460" y2="160" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="200" x2="460" y2="200" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="240" x2="460" y2="240" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="280" x2="460" y2="280" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="320" x2="460" y2="320" stroke="#d4c8a0" stroke-width="0.3" opacity="0.3"/>
  <line x1="120" y1="210" x2="200" y2="150" stroke="#3d2b1f" stroke-width="1.5" filter="url(#sketch)"/>
  <polygon points="200,150 196.0,156.9 192.2,151.9" fill="#3d2b1f"/>
  <line x1="120" y1="210" x2="160" y2="290" stroke="#3d2b1f" stroke-width="1.5" filter="url(#sketch)"/>
  <polygon points="160,290 153.9,284.8 159.5,282.0" fill="#3d2b1f"/>
  <line x1="120" y1="210" x2="180" y2="220" stroke="#8b4513" stroke-width="1.5" filter="url(#sketch)"/>
  <polygon points="180,220 172.2,221.9 173.2,215.7" fill="#8b4513"/>
  <circle cx="320" cy="160" r="15" fill="none" stroke="#3d2b1f" stroke-width="1.5"/>
  <line x1="320" y1="160" x2="380.0" y2="160.0" stroke="#3d2b1f" stroke-width="1.2" filter="url(#sketch)"/>
  <text x="385.0" y="160.0" font-family="Georgia" font-size="8" fill="#3d2b1f" font-style="italic">F₁</text>
  <line x1="320" y1="160" x2="290.0" y2="212.0" stroke="#3d2b1f" stroke-width="1.2" filter="url(#sketch)"/>
  <text x="295.0" y="212.0" font-family="Georgia" font-size="8" fill="#3d2b1f" font-style="italic">F₂</text>
  <line x1="320" y1="160" x2="290.0" y2="108.0" stroke="#3d2b1f" stroke-width="1.2" filter="url(#sketch)"/>
  <text x="295.0" y="108.0" font-family="Georgia" font-size="8" fill="#3d2b1f" font-style="italic">F₃</text>
  <text x="80" y="290" font-family="Georgia, serif" font-size="8" fill="#6b5a4a" font-style="italic" opacity="0.85">Quantitates directae</text>

  <text x="230" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6b5a4a" font-style="italic" opacity="0.7">Vector Geometry</text>

</svg>