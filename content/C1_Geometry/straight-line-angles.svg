<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" font-family="Arial, sans-serif" font-size="14">
  <rect width="500" height="350" fill="#fff"/>
  
  <title>Angles at a Point on a Straight Line</title>
  
  <!-- Straight line -->
  <line x1="40" y1="250" x2="460" y2="250" stroke="#111" stroke-width="3"/>
  <text x="35" y="245" font-weight="bold">X</text>
  <text x="465" y="245" font-weight="bold">Y</text>
  
  <!-- Vertex O -->
  <circle cx="250" cy="250" r="4" fill="#dc2626"/>
  <text x="255" y="265" font-style="italic" font-weight="bold" fill="#dc2626">O</text>
  
  <!-- Three rays emanating from O -->
  <!-- Ray 1 (47° from horizontal) -->
  <line x1="250" y1="250" x2="330" y2="130" stroke="#2563eb" stroke-width="2.5"/>
  <text x="335" y="125" font-style="italic" font-weight="bold" fill="#2563eb">A</text>
  
  <!-- Ray 2 (130° from horizontal = 47+83) -->
  <line x1="250" y1="250" x2="390" y2="190" stroke="#16a34a" stroke-width="2.5"/>
  <text x="395" y="185" font-style="italic" font-weight="bold" fill="#16a34a">B</text>
  
  <!-- Ray 3 (further along) -->
  <line x1="250" y1="250" x2="200" y2="110" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="195" y="105" font-style="italic" font-weight="bold" fill="#8b5cf6">C</text>
  
  <!-- Also on the straight line to the left -->
  <text x="200" y="195" font-style="italic" font-weight="bold">D</text>
  
  <!-- Angle AOB (47°) -->
  <path d="M 250 250 Q 275 205 290 190" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="290" y="205" fill="#dc2626" font-weight="bold" font-size="15">47°</text>
  
  <!-- Angle BOC (83°) -->
  <path d="M 250 250 Q 295 215 305 200" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="315" y="215" fill="#16a34a" font-weight="bold" font-size="15">83°</text>
  
  <!-- Angle COD (the unknown, x) -->
  <path d="M 250 250 Q 230 170 220 160" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="225" y="175" fill="#8b5cf6" font-weight="bold" font-size="18">x</text>
  
  <!-- Right side of straight line (180° continuation) -->
  <path d="M 250 250 Q 380 240 400 245" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- Solution box -->
  <rect x="60" y="280" width="380" height="55" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="300" font-weight="bold">Angles on a straight line sum to 180°:</text>
  <text x="70" y="320">47° + 83° + x = 180° → x = 50°</text>
  <text x="70" y="333">(Since ∠AOB + ∠BOC + ∠COD + ∠DOY = 180° on line XY)</text>
</svg>
